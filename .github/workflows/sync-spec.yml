name: Sync spec

# Pulls the production OpenAPI document daily. When it differs from spec/freeastro.json, the
# SDK is regenerated and fully checked here (pull requests opened with GITHUB_TOKEN do not
# trigger CI), then a pull request is opened or updated from the spec-sync/auto branch.
# A failing generator or check fails this workflow instead of opening a broken PR.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-spec
  cancel-in-progress: false

env:
  SPEC_URL: https://api.freeastroapi.com/openapi.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch the production spec
        run: |
          cp spec/freeastro.json "$RUNNER_TEMP/previous-spec.json"
          python3 scripts/spec_sync.py fetch "$SPEC_URL" --out spec/freeastro.json

      - name: Diff against the vendored spec
        id: diff
        run: |
          python3 scripts/spec_sync.py diff "$RUNNER_TEMP/previous-spec.json" spec/freeastro.json \
            --markdown "$RUNNER_TEMP/spec-diff.md" --github-output "$GITHUB_OUTPUT" > /dev/null
          cat "$RUNNER_TEMP/spec-diff.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate
        if: steps.diff.outputs.changed == 'true'
        run: npm run generate

      - name: Check (generated files, typecheck, tests, build)
        if: steps.diff.outputs.changed == 'true'
        run: npm run check

      - name: Contract tests
        if: steps.diff.outputs.changed == 'true'
        run: npm run test:contract:mock

      - name: Prism log
        if: failure() && steps.diff.outputs.changed == 'true'
        run: tail -n 300 prism.log || true

      - name: Pull request body
        run: |
          {
            cat "$RUNNER_TEMP/spec-diff.md"
            echo
            echo "---"
            echo "Opened by [sync-spec.yml]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$SPEC_URL\`."
            echo "Generation, \`npm run check\` and the Prism contract tests passed in that run."
            echo
            echo "To release after merging: bump \`version\` in \`package.json\` and \`VERSION\` in \`src/index.ts\`"
            echo "(major/minor for breaking changes, minor for new operations, patch otherwise), update"
            echo "\`CHANGELOG.md\`, then push a matching \`v*\` tag."
          } > "$RUNNER_TEMP/pr-body.md"

      # With no changes against main this closes a stale spec-sync PR (delete-branch).
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: spec-sync/auto
          delete-branch: true
          add-paths: |
            spec/freeastro.json
            src/generated/**
          commit-message: ${{ steps.diff.outputs.title }}
          title: ${{ steps.diff.outputs.title }}
          body-path: ${{ runner.temp }}/pr-body.md
          labels: spec-sync
