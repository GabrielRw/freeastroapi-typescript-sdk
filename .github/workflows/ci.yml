name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets maintainers run CI on the bot-opened spec-sync/auto branch (pull requests opened
  # with GITHUB_TOKEN do not trigger workflows): Actions -> CI -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # generate:check, typecheck, unit tests (including the generator tests) and build.
      - run: npm run check

  contract:
    # Every SDK method against a Stoplight Prism mock of spec/freeastro.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Spec tool tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Contract tests
        run: npm run test:contract:mock
      - name: Prism log
        if: failure()
        run: tail -n 300 prism.log || true
